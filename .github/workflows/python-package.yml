# ============================================================
# NekoLoader - Continuous Integration
# ============================================================
#
# This workflow:
#
#   1. Checks out the NekoLoader source code
#   2. Tests Python 3.9, 3.10 and 3.11
#   3. Displays detailed environment information
#   4. Installs Flask and project dependencies
#   5. Displays installed packages
#   6. Checks that Flask can be imported
#   7. Runs Flake8
#   8. Runs the complete pytest test suite
#   9. Displays test results
#  10. Displays a final CI summary
#
# ============================================================

name: NekoLoader CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

# Prevent unnecessary permissions.
permissions:
  contents: read

jobs:

  # ==========================================================
  # BUILD / TEST JOB
  # ==========================================================

  build:

    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      # If one Python version fails, continue testing
      # the other Python versions.
      fail-fast: false

      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout NekoLoader
        uses: actions/checkout@v4

      # ========================================================
      # PYTHON
      # ========================================================

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ========================================================
      # SYSTEM INFORMATION
      # ========================================================

      - name: Show system information
        run: |
          echo ""
          echo "============================================================"
          echo " NekoLoader CI - SYSTEM INFORMATION"
          echo "============================================================"
          echo ""

          echo "Operating system:"
          uname -a

          echo ""
          echo "Linux distribution:"
          cat /etc/os-release

          echo ""
          echo "CPU information:"
          nproc

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "GitHub repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "GitHub branch:"
          echo "${{ github.ref_name }}"

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Short commit:"
          git rev-parse --short HEAD

          echo ""
          echo "Commit author:"
          git log -1 --pretty=format:'%an'

          echo ""
          echo ""
          echo "Commit message:"
          git log -1 --pretty=format:'%s'

          echo ""
          echo ""

      # ========================================================
      # PYTHON INFORMATION
      # ========================================================

      - name: Show Python information
        run: |
          echo ""
          echo "============================================================"
          echo " PYTHON ENVIRONMENT"
          echo "============================================================"
          echo ""

          echo "Python:"
          python --version

          echo ""
          echo "Python executable:"
          which python

          echo ""
          echo "Python implementation:"
          python -c "import platform; print(platform.python_implementation())"

          echo ""
          echo "Python version information:"
          python -c "import sys; print(sys.version)"

          echo ""
          echo "Python installation:"
          python -c "import sys; print(sys.prefix)"

          echo ""
          echo "Pip:"
          python -m pip --version

      # ========================================================
      # REPOSITORY INFORMATION
      # ========================================================

      - name: Inspect repository
        run: |
          echo ""
          echo "============================================================"
          echo " REPOSITORY"
          echo "============================================================"
          echo ""

          echo "Repository contents:"
          find . -maxdepth 2 -type f \
            -not -path './.git/*' \
            | sort

          echo ""
          echo "Python files:"
          find . -name "*.py" \
            -not -path './.git/*' \
            | sort

          echo ""
          echo "Templates:"
          if [ -d "templates" ]; then
            find templates -type f | sort
          else
            echo "No templates directory found."
          fi

      # ========================================================
      # DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        run: |
          echo ""
          echo "============================================================"
          echo " INSTALLING DEPENDENCIES"
          echo "============================================================"
          echo ""

          echo "Upgrading pip..."
          python -m pip install --upgrade pip

          echo ""
          echo "Installing test tools..."
          python -m pip install flake8 pytest

          echo ""
          echo "Checking requirements.txt..."

          if [ -f requirements.txt ]; then
            echo "requirements.txt found."
            echo ""
            cat requirements.txt
            echo ""
            echo "Installing requirements..."
            python -m pip install -r requirements.txt
          else
            echo "WARNING: requirements.txt was not found."
          fi

      # ========================================================
      # INSTALLED PACKAGES
      # ========================================================

      - name: Show installed packages
        run: |
          echo ""
          echo "============================================================"
          echo " INSTALLED PYTHON PACKAGES"
          echo "============================================================"
          echo ""

          python -m pip list

          echo ""
          echo "Dependency tree:"
          python -m pip freeze

      # ========================================================
      # FLASK CHECK
      # ========================================================

      - name: Check Flask
        run: |
          echo ""
          echo "============================================================"
          echo " FLASK CHECK"
          echo "============================================================"
          echo ""

          python -c "import flask; print('Flask imported successfully')"

          python -c "import flask; print('Flask version:', flask.__version__)"

          python -c "from app import app; print('Flask application imported successfully')"

          python -c "from app import app; print('Application name:', app.name)"

          python -c "from app import app; print('Registered routes:'); [print('  ', rule) for rule in app.url_map.iter_rules()]"

      # ========================================================
      # DATABASE CHECK
      # ========================================================

      - name: Check application database code
        run: |
          echo ""
          echo "============================================================"
          echo " DATABASE CHECK"
          echo "============================================================"
          echo ""

          python - <<'PY'
          import app

          print("Database configured as:")
          print(app.DATABASE)

          print()
          print("Database initialization function:")
          print(app.init_db)

          print()
          print("Database code loaded successfully.")
          PY

      # ========================================================
      # FLAKE8
      # ========================================================

      - name: Run Flake8
        run: |
          echo ""
          echo "============================================================"
          echo " FLAKE8 LINTING"
          echo "============================================================"
          echo ""

          echo "Checking Python syntax and serious errors..."
          echo ""

          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

          echo ""
          echo "Running general code-quality analysis..."
          echo ""

          flake8 . \
            --count \
            --exit-zero \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

          echo ""
          echo "Flake8 completed."

      # ========================================================
      # PYTEST COLLECTION
      # ========================================================

      - name: Discover tests
        run: |
          echo ""
          echo "============================================================"
          echo " PYTEST TEST DISCOVERY"
          echo "============================================================"
          echo ""

          pytest --collect-only -q

      # ========================================================
      # PYTEST
      # ========================================================

      - name: Run pytest
        run: |
          echo ""
          echo "============================================================"
          echo " RUNNING NEKOLOADER TESTS"
          echo "============================================================"
          echo ""

          echo "Python version:"
          python --version

          echo ""
          echo "Pytest version:"
          pytest --version

          echo ""
          echo "Starting test suite..."
          echo ""

          pytest -v --tb=short --durations=10

      # ========================================================
      # FINAL SUMMARY
      # ========================================================

      - name: CI summary
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo " NEKOLOADER CI SUMMARY"
          echo "============================================================"
          echo ""

          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Operating system:"
          uname -srm

          echo ""
          echo "Commit:"
          git rev-parse --short HEAD

          echo ""
          echo "Workflow:"
          echo "${{ github.workflow }}"

          echo ""
          echo "Run number:"
          echo "${{ github.run_number }}"

          echo ""
          echo "Job:"
          echo "${{ github.job }}"

          echo ""
          echo "Python matrix version:"
          echo "${{ matrix.python-version }}"

          echo ""
          echo "============================================================"
          echo " Test command: pytest -v --tb=short --durations=10"
          echo "============================================================"
          echo ""

          echo "If this job is green, the Python ${{ matrix.python-version }}"
          echo "environment completed the CI checks successfully."

          echo ""
          echo "============================================================"
