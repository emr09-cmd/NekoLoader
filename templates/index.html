<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekoLoader - Minecraft Mod Loader</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #181820;
            --sidebar-bg: #13131a;
            --accent: #ff79c6;
            --accent-glow: rgba(255, 121, 198, 0.35);
            --text-main: #f8f8f2;
            --text-muted: #6272a4;
            --border: #282a36;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* --- Side Drawer --- */
        aside.sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .version-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .version-item {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid transparent;
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .version-item:hover:not(.disabled) {
            border-color: var(--accent);
        }

        .version-item.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .version-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: transparent;
            border: 1px dashed var(--border);
        }

        .tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: rgba(0,0,0,0.2);
            text-transform: uppercase;
        }

        /* --- Main Content --- */
        main.content {
            flex-grow: 1;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge {
            background-color: var(--border);
            color: var(--accent);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1rem;
            border: 1px solid var(--accent);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 750px;
            width: 100%;
        }

        .download-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        .download-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .version-tag {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .btn-download {
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px var(--accent-glow);
            margin-top: 1.5rem;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        #log-status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Side Drawer -->
    <aside class="sidebar">
        <div class="sidebar-title">Select MC Version</div>
        <ul class="version-list">
            <li class="version-item active" data-version="26.2">
                <span>MC 26.2</span>
                <span class="tag">Stable</span>
            </li>
            <li class="version-item disabled" data-version="26.1">
                <span>MC 26.1</span>
                <span class="tag">Planned</span>
            </li>
            <li class="version-item disabled" data-version="26.0">
                <span>MC 26.0</span>
                <span class="tag">Planned</span>
            </li>
            <li class="version-item disabled" data-version="1.20.6">
                <span>MC 1.20.6</span>
                <span class="tag">Legacy</span>
            </li>
        </ul>
    </aside>

    <!-- Main Section -->
    <main class="content">
        <header>
            <span class="badge" id="activeBadge">Targeting MC 26.2</span>
            <h1>Neko<span>Loader</span></h1>
            <p class="subtitle">Next-generation mod loader engine engineered natively for modern Minecraft builds.</p>
        </header>

        <div class="container">
            <div class="download-card">
                <div class="version-tag" id="displayVersion">NekoLoader for MC 26.2</div>
                <p style="color: var(--text-muted);" id="versionSubtext">Build v1.0.0-release • JDK 21 required</p>

                <button class="btn-download" id="downloadBtn">Download Installer (.JAR)</button>
                <div id="log-status"></div>
            </div>
        </div>
    </main>

    <script>
        let currentVersion = '26.2';

        // Handles switching active version in the sidebar
        document.querySelectorAll('.version-item:not(.disabled)').forEach(item => {
            item.addEventListener('click', (e) => {
                document.querySelectorAll('.version-item').forEach(el => el.classList.remove('active'));
                
                const target = e.currentTarget;
                target.classList.add('active');
                
                currentVersion = target.getAttribute('data-version');
                
                // Update interface state
                document.getElementById('activeBadge').textContent = `Targeting MC ${currentVersion}`;
                document.getElementById('displayVersion').textContent = `NekoLoader for MC ${currentVersion}`;
                document.getElementById('log-status').textContent = '';
            });
        });

        // Trigger installer download via DB backend API
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            const statusDiv = document.getElementById('log-status');
            statusDiv.textContent = `Contacting database & fetching build for MC ${currentVersion}...`;

            try {
                const response = await fetch(`/api/v1/download/${currentVersion}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    statusDiv.textContent = `Logged to DB (ID: ${data.download_id}). Fetching ${data.version} installer...`;
                } else {
                    statusDiv.textContent = 'Failed to process request on server.';
                }
            } catch (err) {
                statusDiv.textContent = 'Server communication error.';
            }
        });
    </script>
</body>
</html>
